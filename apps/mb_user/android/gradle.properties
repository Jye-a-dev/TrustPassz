org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC
android.useAndroidX=true
android.enableJetifier=true

# Disable Kotlin incremental compilation to resolve cross-drive path resolution failure (C:\ vs D:\)
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false

# Execute Kotlin compiler in-process to prevent daemon background file locks on .tab cache files
kotlin.compiler.execution.strategy=in-process

# Prevent VFS daemon watch locks and allow parallel module builds
org.gradle.parallel=true
org.gradle.vfs.watch=false
