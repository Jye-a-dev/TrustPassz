# Gradle Build Cache hiện đại & JVM Optimization
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.vfs.watch=false
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC

# Android Toolchain Flags
android.useAndroidX=true
android.enableJetifier=false

# Chống xung đột phân vùng ổ đĩa (D:\ vs C:\) và ngăn leak daemon lock
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.compiler.execution.strategy=in-process

# Flutter 3.47+ AGP 9 migration opt-out flags (ngăn Flutter migrator tự ghi đè file này)
android.builtInKotlin=false
android.newDsl=false
