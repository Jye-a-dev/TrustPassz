name: Pre-release Cloud Deployment & Synthetic Smoke Health Check

on:
  push:
    branches:
      - pre-release
      - staging
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Skip cloud deploy dispatch (run smoke & balance checks directly)'
        required: false
        type: boolean
        default: false
      dry_run_oracle:
        description: 'Run Oracle Relayer Monitor in dry-run mode (simulate alerts)'
        required: false
        type: boolean
        default: false
      mock_smoke:
        description: 'Mock synthetic smoke responses (for testing CI pipeline flow)'
        required: false
        type: boolean
        default: false

concurrency:
  group: pre-release-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Cloud Deployment Dispatch (Render & Vercel)
  # ============================================================================
  cloud-deploy-dispatch:
    name: Cloud Deployment Dispatch
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_deploy != 'true' }}
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger Render Server Deploy Hook (NestJS)
        run: |
          if [ -n "${{ secrets.RENDER_SERVER_DEPLOY_HOOK_URL }}" ]; then
            echo "::notice ::Triggering Render deploy hook for apps/server..."
            curl -sS -X POST "${{ secrets.RENDER_SERVER_DEPLOY_HOOK_URL }}" || echo "Render Server hook request sent"
          else
            echo "::warning ::RENDER_SERVER_DEPLOY_HOOK_URL secret not set. Skipping Render Server deploy trigger."
          fi

      - name: Trigger Render AI Pipeline Deploy Hook (FastAPI)
        run: |
          if [ -n "${{ secrets.RENDER_PIPELINE_DEPLOY_HOOK_URL }}" ]; then
            echo "::notice ::Triggering Render deploy hook for apps/ai_pipeline..."
            curl -sS -X POST "${{ secrets.RENDER_PIPELINE_DEPLOY_HOOK_URL }}" || echo "Render Pipeline hook request sent"
          else
            echo "::warning ::RENDER_PIPELINE_DEPLOY_HOOK_URL secret not set. Skipping Render Pipeline deploy trigger."
          fi

      - name: Trigger Vercel User Client Deploy Hook (cl_user)
        run: |
          if [ -n "${{ secrets.VERCEL_USER_DEPLOY_HOOK_URL }}" ]; then
            echo "::notice ::Triggering Vercel deploy hook for apps/cl_user..."
            curl -sS -X POST "${{ secrets.VERCEL_USER_DEPLOY_HOOK_URL }}" || echo "Vercel User hook request sent"
          else
            echo "::warning ::VERCEL_USER_DEPLOY_HOOK_URL secret not set. Skipping Vercel User deploy trigger."
          fi

      - name: Trigger Vercel Admin Client Deploy Hook (cl_admin)
        run: |
          if [ -n "${{ secrets.VERCEL_ADMIN_DEPLOY_HOOK_URL }}" ]; then
            echo "::notice ::Triggering Vercel deploy hook for apps/cl_admin..."
            curl -sS -X POST "${{ secrets.VERCEL_ADMIN_DEPLOY_HOOK_URL }}" || echo "Vercel Admin hook request sent"
          else
            echo "::warning ::VERCEL_ADMIN_DEPLOY_HOOK_URL secret not set. Skipping Vercel Admin deploy trigger."
          fi

      - name: Grace Period for Cloud Build Initialization
        run: |
          echo "Waiting 20s for cloud providers to initialize deploy containers..."
          sleep 20

  # ============================================================================
  # Job 2: Synthetic E2E Smoke Health Check (Cold-Start Exponential Backoff)
  # ============================================================================
  synthetic-smoke-check:
    name: Synthetic E2E Smoke Health Check
    runs-on: ubuntu-latest
    needs: [cloud-deploy-dispatch]
    if: always() && (needs.cloud-deploy-dispatch.result == 'success' || needs.cloud-deploy-dispatch.result == 'skipped')
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -s package-lock.json ]; then
            npm ci || npm install --no-audit --no-fund
          elif [ -f package.json ]; then
            npm install --no-audit --no-fund
          fi

      - name: Execute Synthetic Health Probes
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.mock_smoke }}" = "true" ]; then
            FLAGS="${FLAGS} --mock"
          fi

          npx tsx packages/tooling/scripts/synthetic-smoke-check.ts ${FLAGS}
        env:
          RENDER_SERVER_HOST: ${{ secrets.RENDER_SERVER_HOST || vars.RENDER_SERVER_HOST }}
          RENDER_PIPELINE_HOST: ${{ secrets.RENDER_PIPELINE_HOST || vars.RENDER_PIPELINE_HOST }}
          VERCEL_USER_HOST: ${{ secrets.VERCEL_USER_HOST || vars.VERCEL_USER_HOST }}
          VERCEL_ADMIN_HOST: ${{ secrets.VERCEL_ADMIN_HOST || vars.VERCEL_ADMIN_HOST }}
          NODE_ENV: pre-release

      - name: Upload Smoke Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-health-report
          path: artifacts/smoke-health-report.json
          retention-days: 7

  # ============================================================================
  # Job 3: Oracle Relayer Balance Monitor & Sentry Verification
  # ============================================================================
  oracle-relayer-monitor-verify:
    name: Oracle Relayer Balance Monitor & Sentry
    runs-on: ubuntu-latest
    needs: [synthetic-smoke-check]
    if: always() && needs.synthetic-smoke-check.result == 'success'
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -s package-lock.json ]; then
            npm ci || npm install --no-audit --no-fund
          elif [ -f package.json ]; then
            npm install --no-audit --no-fund
          fi

      - name: Execute Oracle Relayer Gas & Balance Verification
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run_oracle }}" = "true" ]; then
            FLAGS="${FLAGS} --dry-run"
          fi

          npx tsx packages/tooling/scripts/monitor-oracle-balance.ts ${FLAGS}
        env:
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          ORACLE_RELAYER_ADDRESS: ${{ secrets.ORACLE_RELAYER_ADDRESS }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          SOLANA_RELAYER_PUBLIC_KEY: ${{ secrets.SOLANA_RELAYER_PUBLIC_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NODE_ENV: pre-release

      - name: Upload Oracle Sentry Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-balance-report
          path: artifacts/oracle-balance-alert.json
          retention-days: 7

