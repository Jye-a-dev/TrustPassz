name: CI/CD Pipeline Verification

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-lint-types:
    name: Audit Monorepo (Lint & Typecheck)
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Cache Turborepo Artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install Monorepo Dependencies (Resilient Fallback)
        run: |
          if [ -s package-lock.json ]; then
            npm ci --prefer-offline --no-audit
          elif [ -f package.json ]; then
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Generate Prisma Client Types
        working-directory: apps/server
        env:
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/trustpassz_ci?schema=public"
          DIRECT_URL: "postgresql://mock:mock@localhost:5432/trustpassz_ci?schema=public"
        run: npx prisma generate

      - name: Execute Turborepo Lint & Typecheck
        run: npx turbo run lint typecheck

  verify-server:
    name: Verify Backend Server (NestJS & Prisma)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=4096"
      DATABASE_URL: "postgresql://mock:mock@localhost:5432/trustpassz_ci?schema=public"
      DIRECT_URL: "postgresql://mock:mock@localhost:5432/trustpassz_ci?schema=public"
      JWT_SECRET: "mock-jwt-secret-min-32-chars-for-ci"
      BASE_SEPOLIA_RPC_URL: "https://sepolia.base.org"
      ESCROW_CONTRACT_ADDRESS: "0x88a82fe4f3be44bb493fa6e7efd68313e7c2ec15"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies (Resilient Fallback)
        run: |
          if [ -s package-lock.json ]; then
            npm ci --prefer-offline --no-audit
          elif [ -f package.json ]; then
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Generate Prisma Client
        working-directory: apps/server
        run: npx prisma generate

      - name: Build NestJS Server
        working-directory: apps/server
        run: npm run build

      - name: Run Server Unit & Controller Tests
        working-directory: apps/server
        env:
          NODE_ENV: test
        run: npm test -- --passWithNoTests

  verify-frontends:
    name: Verify Frontends (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [cl_user, cl_admin]
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: "https://mock-api.trustpassz.com"
      NEXT_PUBLIC_ESCROW_CONTRACT_ADDRESS: "0x88a82fe4f3be44bb493fa6e7efd68313e7c2ec15"
      NEXT_PUBLIC_CHAIN_ID: "84532"
      NEXT_PUBLIC_RPC_URL: "https://sepolia.base.org"
      NEXT_PUBLIC_SUPABASE_URL: "https://mock-supabase.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key"
      NEXT_PUBLIC_APP_URL: "http://localhost:5000"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: "mock-google-client-id"
      NEXT_PUBLIC_SOLANA_NETWORK: "devnet"
      NEXT_PUBLIC_SOLANA_RPC_URL: "https://api.devnet.solana.com"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Cache Next.js Compilation Artifacts
        uses: actions/cache@v4
        with:
          path: apps/${{ matrix.app }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ matrix.app }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ matrix.app }}-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-${{ matrix.app }}-

      - name: Install Monorepo Dependencies (Resilient Fallback)
        run: |
          if [ -s package-lock.json ]; then
            npm ci --prefer-offline --no-audit
          elif [ -f package.json ]; then
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Run Frontend Unit Tests (${{ matrix.app }})
        run: |
          if [ "${{ matrix.app }}" = "cl_user" ]; then
            npm test --workspace=apps/cl_user
          elif [ -f "apps/${{ matrix.app }}/package.json" ] && grep -q '"test":' "apps/${{ matrix.app }}/package.json"; then
            npm test --workspace=apps/${{ matrix.app }}
          fi

      - name: Build Next.js Application (${{ matrix.app }})
        run: npm run build --workspace=apps/${{ matrix.app }}

  verify-ai-pipeline:
    name: Verify AI Pipeline (Python 3.11)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: "test"
      GEMINI_API_KEY: "mock-ci-key"
      AI_MODEL_PATH: "Qwen/Qwen2-VL-2B-Instruct"
      AI_DEVICE: "cpu"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        working-directory: apps/ai_pipeline
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Syntax Check & Verification
        run: |
          python -m py_compile apps/ai_pipeline/main.py
          python -c "import ast; [ast.parse(open(f, encoding='utf-8').read()) for f in ['apps/ai_pipeline/engine.py', 'apps/ai_pipeline/main.py']]"

      - name: Run AI Pipeline Pytest Suite (Arbitration & Suggestion)
        env:
          PYTHONPATH: apps/ai_pipeline
          ENVIRONMENT: "test"
          GEMINI_API_KEY: "mock-ci-key"
          AI_MODEL_PATH: "Qwen/Qwen2-VL-2B-Instruct"
          AI_DEVICE: "cpu"
        run: pytest apps/ai_pipeline/tests apps/ai_pipeline/test_suggestion.py -v

  verify-contracts:
    name: Verify Smart Contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Foundry Toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Foundry Dependencies
        run: |
          rm -rf lib/forge-std lib/openzeppelin-contracts
          forge install foundry-rs/forge-std --no-commit
          forge install OpenZeppelin/openzeppelin-contracts --no-commit

      - name: Run Foundry Unit & Integration Tests
        run: forge test -vvv

  verify-e2e-tests:
    name: Verify E2E Integration Tests (packages/e2e-tests)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NODE_OPTIONS: "--max-old-space-size=4096"
      DATABASE_URL: "postgresql://mock:mock@localhost:5432/trustpassz_ci?schema=public"
      DIRECT_URL: "postgresql://mock:mock@localhost:5432/trustpassz_ci?schema=public"
      JWT_SECRET: "mock-jwt-secret-min-32-chars-for-ci"
      BASE_SEPOLIA_RPC_URL: "https://sepolia.base.org"
      ESCROW_CONTRACT_ADDRESS: "0x88a82fe4f3be44bb493fa6e7efd68313e7c2ec15"
      API_URL: "http://localhost:3001"
      AI_PIPELINE_URL: "http://localhost:3100"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies (Resilient Fallback)
        run: |
          if [ -s package-lock.json ]; then
            npm ci --prefer-offline --no-audit
          elif [ -f package.json ]; then
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Generate Prisma Client Types
        working-directory: apps/server
        run: npx prisma generate

      - name: Run E2E Integration Tests (State Machine, Dispute, Concurrency)
        working-directory: packages/e2e-tests
        run: npm test

  ci-status-gate:
    name: CI Pipeline Quality Gate
    needs: [audit-lint-types, verify-server, verify-frontends, verify-ai-pipeline, verify-contracts, verify-e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Monorepo CI Pipeline Status
        run: |
          echo "=========================================================="
          echo "   TRUSTPASSZ MONOREPO CI/CD STATUS GATE AUDIT"
          echo "=========================================================="
          echo "audit-lint-types:    ${{ needs.audit-lint-types.result }}"
          echo "verify-server:       ${{ needs.verify-server.result }}"
          echo "verify-frontends:    ${{ needs.verify-frontends.result }}"
          echo "verify-ai-pipeline:  ${{ needs.verify-ai-pipeline.result }}"
          echo "verify-contracts:    ${{ needs.verify-contracts.result }}"
          echo "verify-e2e-tests:    ${{ needs.verify-e2e-tests.result }}"
          echo "=========================================================="

          if [ "${{ needs.audit-lint-types.result }}" != "success" ] || \
             [ "${{ needs.verify-server.result }}" != "success" ] || \
             [ "${{ needs.verify-frontends.result }}" != "success" ] || \
             [ "${{ needs.verify-ai-pipeline.result }}" != "success" ] || \
             [ "${{ needs.verify-contracts.result }}" != "success" ] || \
             [ "${{ needs.verify-e2e-tests.result }}" != "success" ]; then
            echo "::error::CI Pipeline Failed: One or more matrix jobs did not complete with exit code 0. Pull Request merge blocked."
            exit 1
          fi

          echo "✅ All CI verification matrix jobs finished with exit code 0."
          echo "🚀 Quality Gate PASSED: Monorepo verification completed within < 6 minutes target window."
