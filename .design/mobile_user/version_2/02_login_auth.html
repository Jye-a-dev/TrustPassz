<!DOCTYPE html>

      <span class="text-slate-900 font-bold">9:41</span>
      <div class="w-28 h-7 bg-black rounded-full flex items-center justify-between px-3 text-white">

          TP
        </div>
        <h1 class="text-xl font-bold text-slate-900 mt-4 tracking-tight">Chào mừng trở lại</h1>
        <p class="text-xs text-slate-500 mt-1 max-w-[280px] mx-auto leading-relaxed">

        <div class="relative my-5">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-200"></div>
          </div>
          <div class="relative flex justify-center text-xs uppercase">
            <span class="bg-[#FAFAFB] px-3 text-slate-400 font-medium">hoặc số điện thoại / email</span>

        <!-- Universal Single Input -->
        <div class="space-y-3">
          <input type="text" placeholder="Email hoặc số điện thoại" class="w-full h-12 px-4 rounded-xl bg-white border border-slate-300 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 transition-all">
          
          <a href="03_home_dashboard.html" class="w-full h-12 rounded-xl bg-white hover:bg-slate-50 text-slate-800 font-semibold text-sm border border-slate-300 flex items-center justify-center gap-2 shadow-sm transition-all active:scale-[0.98]">
            <span>Tiếp tục với OTP</span>
            <svg class="w-4 h-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>

      <div class="pt-4 text-center">

    <footer class="pt-1 pb-2 shrink-0">
