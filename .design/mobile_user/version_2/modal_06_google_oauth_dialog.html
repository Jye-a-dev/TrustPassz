<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustPassz Mobile v2 - Google OAuth Dialog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              emerald: '#10B981',
              cyan: '#06B6D4',
              amber: '#F59E0B',
              rose: '#F43F5E',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes laserScan {
      0% { top: 5%; opacity: 0.8; }
      50% { top: 90%; opacity: 1; }
      100% { top: 5%; opacity: 0.8; }
    }
    .animate-laser {
      animation: laserScan 2.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-200 dark:bg-slate-950 min-h-screen flex items-center justify-center p-4">
  <!-- Device Shell (iPhone 16 Frame: 393 x 852 px) -->
  <div id="device-shell" class="w-[393px] h-[852px] bg-white dark:bg-[#080C14] text-slate-900 dark:text-slate-100 rounded-[52px] border-[10px] border-slate-300 dark:border-slate-800 shadow-2xl relative overflow-hidden flex flex-col font-sans select-none transition-colors duration-200">
    
    <!-- Top System Header: Dynamic Island & Status Bar -->
    <div class="pt-3 px-6 flex items-center justify-between text-xs font-semibold z-20 shrink-0">
      <span>9:41</span>
      <!-- Dynamic Island -->
      <div class="w-28 h-7 bg-black rounded-full flex items-center justify-between px-3 text-white text-[10px]">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-[9px] text-slate-400 font-mono tracking-tighter">BASE ESCROW</span>
      </div>
      <!-- Theme Toggle & Battery -->
      <div class="flex items-center gap-2">
        <button onclick="toggleTheme()" class="p-1 rounded-full border border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:scale-105 active:scale-95 transition-all text-xs" title="Chuyển chế độ Sáng / Tối">
          🌓
        </button>
        <span class="text-xs">100%</span>
      </div>
    </div>

    <!-- Background Screen (Dimmed/Blurred Under Modal) -->
    <main class="flex-1 overflow-hidden p-4 space-y-4 filter blur-[1px] opacity-40 pointer-events-none">
      
      <div class="p-4 rounded-3xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 space-y-3">
        <div class="h-6 w-32 bg-slate-300 dark:bg-slate-700 rounded"></div>
        <div class="h-20 w-full bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
      </div>
      <div class="p-4 rounded-3xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 space-y-3">
        <div class="h-4 w-40 bg-slate-300 dark:bg-slate-700 rounded"></div>
        <div class="h-10 w-full bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
      </div>

    </main>

    <!-- Modal / Bottom Sheet ACTIVE STATE Overlay -->
    <div class="absolute inset-0 z-50 bg-black/60 dark:bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-3 transition-all duration-300">
      
      <div class="w-full bg-white dark:bg-[#0F172A] rounded-3xl border border-slate-300 dark:border-slate-800 p-5 shadow-2xl space-y-4">
        <!-- Google Header -->
        <div class="flex items-center gap-2.5 pb-2 border-b border-slate-200 dark:border-slate-800">
          <svg class="w-6 h-6" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.54 0 2.94.55 4.04 1.45l3.03-3.03C17.24 1.7 14.78 1 12 1 7.46 1 3.59 3.58 1.63 7.37l3.71 2.88C6.23 7.42 8.87 5 12 5z"/>
            <path fill="#4285F4" d="M23.49 12.28c0-.79-.07-1.54-.19-2.28H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58l3.71 2.88c2.16-1.99 3.71-4.93 3.71-8.69z"/>
            <path fill="#FBBC05" d="M5.34 14.75c-.24-.72-.38-1.49-.38-2.28 0-.79.14-1.56.38-2.28L1.63 7.37C.59 9.47 0 11.67 0 14s.59 4.53 1.63 6.63l3.71-2.88z"/>
            <path fill="#34A853" d="M12 23c3.24 0 5.95-1.08 7.93-2.91l-3.71-2.88c-1.08.72-2.45 1.16-4.22 1.16-3.13 0-5.77-2.12-6.66-4.99L1.63 16.26C3.59 20.42 7.46 23 12 23z"/>
          </svg>
          <span class="text-xs font-semibold text-slate-700 dark:text-slate-300">Đăng nhập bằng Google</span>
        </div>

        <div>
          <h3 class="text-sm font-bold text-slate-900 dark:text-white">Chọn tài khoản tiếp tục với TrustPassz</h3>
          <p class="text-xs text-slate-500 mt-1">Ứng dụng sẽ chỉ nhận tên, email và ảnh đại diện công khai.</p>
        </div>

        <!-- Account Item Card -->
        <div class="p-3 rounded-2xl bg-slate-50 dark:bg-[#080C14] border border-slate-300 dark:border-slate-800 flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-cyan-600 text-white font-bold flex items-center justify-center text-sm shadow">
            HN
          </div>
          <div class="flex-1">
            <p class="text-xs font-bold text-slate-900 dark:text-white">Lê Hoàng Nam</p>
            <p class="text-[11px] text-slate-500">hoangnam@trustpassz.com</p>
          </div>
          <span class="text-emerald-500 text-xs font-bold">✓</span>
        </div>

        <!-- Buttons -->
        <div class="space-y-2 pt-1">
          <a href="03_home_dashboard.html" class="w-full h-11 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs border border-blue-700 flex items-center justify-center shadow-md">
            <span>Tiếp tục dưới tên Lê Hoàng Nam</span>
          </a>
          <a href="02_login_auth.html" class="w-full h-10 rounded-xl bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-semibold border border-slate-300 dark:border-slate-700 flex items-center justify-center">
            Hủy bỏ
          </a>
        </div>
      </div>

    </div>

    <!-- Home Indicator -->
    <div class="pt-1 pb-2 shrink-0 z-50">
      <div class="w-32 h-1 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto"></div>
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }
    
  </script>
</body>
</html>
