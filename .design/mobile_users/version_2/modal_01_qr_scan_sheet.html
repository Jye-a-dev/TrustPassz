<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustPassz Mobile v2 - Quét QR Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              emerald: '#10B981',
              cyan: '#06B6D4',
              amber: '#F59E0B',
              rose: '#F43F5E',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes laserScan {
      0% { top: 5%; opacity: 0.8; }
      50% { top: 90%; opacity: 1; }
      100% { top: 5%; opacity: 0.8; }
    }
    .animate-laser {
      animation: laserScan 2.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-200 dark:bg-slate-950 min-h-screen flex items-center justify-center p-4">
  <!-- Device Shell (iPhone 16 Frame: 393 x 852 px) -->
  <div id="device-shell" class="w-[393px] h-[852px] bg-white dark:bg-[#080C14] text-slate-900 dark:text-slate-100 rounded-[52px] border-[10px] border-slate-300 dark:border-slate-800 shadow-2xl relative overflow-hidden flex flex-col font-sans select-none transition-colors duration-200">
    
    <!-- Top System Header: Dynamic Island & Status Bar -->
    <div class="pt-3 px-6 flex items-center justify-between text-xs font-semibold z-20 shrink-0">
      <span>9:41</span>
      <!-- Dynamic Island -->
      <div class="w-28 h-7 bg-black rounded-full flex items-center justify-between px-3 text-white text-[10px]">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-[9px] text-slate-400 font-mono tracking-tighter">BASE ESCROW</span>
      </div>
      <!-- Theme Toggle & Battery -->
      <div class="flex items-center gap-2">
        <button onclick="toggleTheme()" class="p-1 rounded-full border border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:scale-105 active:scale-95 transition-all text-xs" title="Chuyển chế độ Sáng / Tối">
          🌓
        </button>
        <span class="text-xs">100%</span>
      </div>
    </div>

    <!-- Background Screen (Dimmed/Blurred Under Modal) -->
    <main class="flex-1 overflow-hidden p-4 space-y-4 filter blur-[1px] opacity-40 pointer-events-none">
      
      <div class="p-4 rounded-3xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 space-y-3">
        <div class="h-6 w-32 bg-slate-300 dark:bg-slate-700 rounded"></div>
        <div class="h-20 w-full bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
      </div>
      <div class="p-4 rounded-3xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 space-y-3">
        <div class="h-4 w-40 bg-slate-300 dark:bg-slate-700 rounded"></div>
        <div class="h-10 w-full bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
      </div>

    </main>

    <!-- Modal / Bottom Sheet ACTIVE STATE Overlay -->
    <div class="absolute inset-0 z-50 bg-black/60 dark:bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-3 transition-all duration-300">
      
      <div class="w-full bg-white dark:bg-[#0F172A] rounded-t-[36px] sm:rounded-3xl border border-slate-300 dark:border-slate-800 p-5 shadow-2xl space-y-4">
        <!-- Handlebar -->
        <div class="w-10 h-1 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto -mt-1 mb-2 sm:hidden"></div>

        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-7 h-7 rounded-lg bg-cyan-50 dark:bg-cyan-950/40 border border-cyan-300 dark:border-cyan-500/40 flex items-center justify-center text-cyan-600 dark:text-cyan-400">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="6" height="6" x="3" y="3" rx="1"/><rect width="6" height="6" x="15" y="3" rx="1"/><rect width="6" height="6" x="3" y="15" rx="1"/></svg>
            </span>
            <h3 class="text-sm font-bold text-slate-900 dark:text-white">Quét Mã VietQR / Kèo</h3>
          </div>
          <a href="03_home_dashboard.html" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 flex items-center justify-center text-slate-500 hover:text-slate-900 dark:hover:text-white text-xs">✕</a>
        </div>

        <!-- Camera Viewfinder -->
        <div class="relative w-full h-56 bg-slate-950 rounded-2xl overflow-hidden border-2 border-slate-700 flex items-center justify-center">
          <!-- Animated Laser Beam -->
          <div class="absolute left-4 right-4 h-0.5 bg-gradient-to-r from-transparent via-cyan-400 to-transparent shadow-[0_0_12px_#06B6D4] animate-laser"></div>

          <!-- Viewfinder Corners -->
          <div class="absolute w-44 h-44 border-2 border-dashed border-cyan-500/60 rounded-xl pointer-events-none flex items-center justify-center">
            <span class="text-[10px] font-mono text-cyan-400 bg-black/60 px-2 py-0.5 rounded">Căn chỉnh mã QR</span>
          </div>

          <!-- Corner Accents -->
          <div class="absolute top-8 left-14 w-4 h-4 border-t-2 border-l-2 border-cyan-400"></div>
          <div class="absolute top-8 right-14 w-4 h-4 border-t-2 border-r-2 border-cyan-400"></div>
          <div class="absolute bottom-8 left-14 w-4 h-4 border-b-2 border-l-2 border-cyan-400"></div>
          <div class="absolute bottom-8 right-14 w-4 h-4 border-b-2 border-r-2 border-cyan-400"></div>
        </div>

        <!-- Actions -->
        <div class="grid grid-cols-2 gap-2">
          <button class="h-11 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 text-xs font-semibold border border-slate-300 dark:border-slate-700 flex items-center justify-center gap-1.5 transition-all">
            <svg class="w-4 h-4 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            <span>Bật Flash</span>
          </button>
          <button class="h-11 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 text-xs font-semibold border border-slate-300 dark:border-slate-700 flex items-center justify-center gap-1.5 transition-all">
            <svg class="w-4 h-4 text-cyan-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            <span>Chọn từ Album</span>
          </button>
        </div>
      </div>

    </div>

    <!-- Home Indicator -->
    <div class="pt-1 pb-2 shrink-0 z-50">
      <div class="w-32 h-1 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto"></div>
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }
    
  </script>
</body>
</html>
