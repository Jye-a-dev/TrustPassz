<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustPassz Mobile v2 - Xác Nhận Trả Giá</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              emerald: '#10B981',
              cyan: '#06B6D4',
              amber: '#F59E0B',
              rose: '#F43F5E',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes laserScan {
      0% { top: 5%; opacity: 0.8; }
      50% { top: 90%; opacity: 1; }
      100% { top: 5%; opacity: 0.8; }
    }
    .animate-laser {
      animation: laserScan 2.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-200 dark:bg-slate-950 min-h-screen flex items-center justify-center p-4">
  <!-- Device Shell (iPhone 16 Frame: 393 x 852 px) -->
  <div id="device-shell" class="w-[393px] h-[852px] bg-white dark:bg-[#080C14] text-slate-900 dark:text-slate-100 rounded-[52px] border-[10px] border-slate-300 dark:border-slate-800 shadow-2xl relative overflow-hidden flex flex-col font-sans select-none transition-colors duration-200">
    
    <!-- Top System Header: Dynamic Island & Status Bar -->
    <div class="pt-3 px-6 flex items-center justify-between text-xs font-semibold z-20 shrink-0">
      <span>9:41</span>
      <!-- Dynamic Island -->
      <div class="w-28 h-7 bg-black rounded-full flex items-center justify-between px-3 text-white text-[10px]">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-[9px] text-slate-400 font-mono tracking-tighter">BASE ESCROW</span>
      </div>
      <!-- Theme Toggle & Battery -->
      <div class="flex items-center gap-2">
        <button onclick="toggleTheme()" class="p-1 rounded-full border border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:scale-105 active:scale-95 transition-all text-xs" title="Chuyển chế độ Sáng / Tối">
          🌓
        </button>
        <span class="text-xs">100%</span>
      </div>
    </div>

    <!-- Background Screen (Dimmed/Blurred Under Modal) -->
    <main class="flex-1 overflow-hidden p-4 space-y-4 filter blur-[1px] opacity-40 pointer-events-none">
      
      <div class="p-4 rounded-3xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 space-y-3">
        <div class="h-6 w-32 bg-slate-300 dark:bg-slate-700 rounded"></div>
        <div class="h-20 w-full bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
      </div>
      <div class="p-4 rounded-3xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 space-y-3">
        <div class="h-4 w-40 bg-slate-300 dark:bg-slate-700 rounded"></div>
        <div class="h-10 w-full bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
      </div>

    </main>

    <!-- Modal / Bottom Sheet ACTIVE STATE Overlay -->
    <div class="absolute inset-0 z-50 bg-black/60 dark:bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-3 transition-all duration-300">
      
      <div class="w-full bg-white dark:bg-[#0F172A] rounded-3xl border border-slate-300 dark:border-slate-800 p-5 shadow-2xl space-y-4">
        <div class="text-center space-y-1">
          <div class="w-12 h-12 rounded-2xl bg-cyan-50 dark:bg-cyan-950/40 border border-cyan-300 dark:border-cyan-500/40 mx-auto flex items-center justify-center text-cyan-600 dark:text-cyan-400">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/></svg>
          </div>
          <h3 class="text-base font-bold text-slate-900 dark:text-white">Xác Nhận Đề Xuất Giá</h3>
          <p class="text-xs text-slate-500">Người bán sẽ có 2 giờ để chấp nhận hoặc phản hồi đề xuất.</p>
        </div>

        <!-- Price Comparison Box -->
        <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-[#080C14] border border-slate-300 dark:border-slate-800 space-y-2 text-xs">
          <div class="flex items-center justify-between text-slate-500">
            <span>Giá niêm yết ban đầu:</span>
            <span class="font-mono line-through">4.000.000 ₫</span>
          </div>
          <div class="flex items-center justify-between font-bold text-slate-900 dark:text-white">
            <span>Giá đề xuất mới:</span>
            <span class="font-mono text-base text-cyan-600 dark:text-cyan-400">3.600.000 ₫</span>
          </div>
          <div class="pt-1.5 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between text-emerald-600 dark:text-emerald-400 font-bold">
            <span>Khoản tiết kiệm:</span>
            <span class="font-mono">-400.000 ₫ (-10%)</span>
          </div>
        </div>

        <!-- Buttons -->
        <div class="space-y-2">
          <a href="07_checkout_vietqr.html" class="w-full h-11 rounded-xl bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] text-slate-950 font-bold text-xs tracking-wide shadow-md border border-emerald-600 dark:border-emerald-400 flex items-center justify-center gap-1.5 transition-all">
            <span>Xác Nhận & Gửi Đề Xuất Ngay</span>
          </a>
          <a href="06_deal_room.html" class="w-full h-10 rounded-xl bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-semibold border border-slate-300 dark:border-slate-700 flex items-center justify-center transition-all">
            Điều Chỉnh Lại
          </a>
        </div>
      </div>

    </div>

    <!-- Home Indicator -->
    <div class="pt-1 pb-2 shrink-0 z-50">
      <div class="w-32 h-1 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto"></div>
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }
    
  </script>
</body>
</html>
