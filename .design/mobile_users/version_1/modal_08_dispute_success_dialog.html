<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustPassz Mobile - Khiếu Nại Đã Gửi Thành Công</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-rose-500 selection:text-white">

  <!-- DEVICE SHELL FRAME (iPhone 393px x 852px) -->
  <div class="w-[393px] h-[852px] bg-[#080C14] text-slate-100 rounded-[52px] border-[10px] border-slate-800/90 shadow-2xl relative overflow-hidden flex flex-col font-sans select-none">
    
    <!-- TOP STATUS BAR & DYNAMIC ISLAND -->
    <div class="h-11 w-full pt-2 px-7 flex justify-between items-center text-xs text-slate-300 z-50 shrink-0">
      <span class="font-semibold text-sm tracking-tight">9:41</span>
      <div class="w-28 h-7 bg-black rounded-full mx-auto -mt-1 flex items-center justify-between px-3 shadow-inner">
        <div class="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-800"></div>
        <div class="w-2.5 h-2.5 rounded-full bg-rose-500/30 border border-rose-500/80 animate-pulse"></div>
      </div>
      <div class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 fill-slate-200" viewBox="0 0 24 24"><path d="M2 17h3v4H2v-4zm5-5h3v9H7v-9zm5-5h3v14h-3V7zm5-5h3v19h-3V2z"/></svg>
        <svg class="w-4 h-4 fill-slate-200" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.22c3.43 0 6.55 1.39 8.84 3.64l-8.84 8.84-8.84-8.84C5.45 8.61 8.57 7.22 12 7.22z"/></svg>
        <div class="w-5 h-2.5 border border-slate-300 rounded-sm p-0.5 flex items-center"><div class="w-3.5 h-1.5 bg-slate-100 rounded-2xs"></div></div>
      </div>
    </div>

    <!-- MAIN CONTAINER WITH DIMMED PARENT UNDERNEATH & ACTIVE MODAL OVERLAY -->
    <div class="flex-1 overflow-hidden relative flex flex-col">

      <!-- DIMMED PARENT BACKGROUND SCREEN (DISPUTE FILING SCREEN) -->
      <div class="absolute inset-0 px-5 pt-3 pb-4 flex flex-col gap-3 opacity-25 pointer-events-none select-none blur-[2px]">
        <div class="h-10 bg-slate-800 rounded-xl"></div>
        <div class="h-16 rounded-xl bg-rose-950/40 border border-rose-500/30"></div>
        <div class="h-12 rounded-xl bg-[#0F172A] border border-slate-800"></div>
        <div class="h-28 rounded-xl bg-[#0F172A] border border-slate-800"></div>
        <div class="h-32 rounded-xl bg-[#0F172A] border border-slate-800"></div>
      </div>

      <!-- ACTIVE BACKDROP BLUR OVERLAY -->
      <div class="absolute inset-0 bg-black/70 backdrop-blur-sm z-30"></div>

      <!-- ACTIVE SUCCESS DIALOG POPUP -->
      <div class="z-40 w-[335px] mx-auto my-auto p-5 rounded-2xl bg-[#0F172A] border border-slate-800 shadow-2xl flex flex-col items-center text-center animate-in fade-in zoom-in-95 duration-200">
        
        <!-- Glowing Shield TrustPassz Icon Badge -->
        <div class="size-14 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-400 flex items-center justify-center mb-3.5 shadow-[0_0_25px_rgba(244,63,94,0.35)]">
          <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4" stroke="#F43F5E" stroke-width="2.5"/>
          </svg>
        </div>

        <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-rose-950/60 border border-rose-500/30 text-rose-300 text-[10px] font-mono font-bold mb-2 uppercase">
          <span class="w-1.5 h-1.5 rounded-full bg-rose-400 animate-pulse"></span>
          SMART CONTRACT LOCKED
        </div>

        <h3 class="text-base font-bold text-white tracking-tight">Khiếu Nại Đã Gửi Thành Công!</h3>
        
        <p class="text-xs text-slate-300 mt-2 leading-relaxed text-center px-1">
          Mã tranh chấp đã được ghi nhận vào Smart Contract. Hệ thống <span class="text-rose-400 font-semibold">AI Vision Arbitrator</span> đang trích xuất và đối soát các chứng cứ unboxing/log lỗi với cam kết của bên bán.
        </p>

        <!-- SLA Card -->
        <div class="w-full mt-3.5 p-2.5 rounded-xl bg-[#080C14] border border-slate-800 flex items-center justify-between text-xs font-mono">
          <span class="text-slate-400 text-[11px]">SLA Thẩm Định AI:</span>
          <span class="text-emerald-400 font-bold flex items-center gap-1">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            &lt; 15 phút
          </span>
        </div>

        <div class="w-full mt-4">
          <button type="button" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold text-sm min-h-[44px] cursor-pointer shadow-lg shadow-rose-950/50 transition-all active:scale-[0.99] flex items-center justify-center gap-2">
            <span>Hoàn tất &amp; Về Trang Chủ</span>
            <svg class="w-4 h-4 stroke-[2.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
          </button>
        </div>

      </div>

    </div>

    <!-- BOTTOM HOME INDICATOR -->
    <div class="w-full shrink-0 z-50">
      <div class="w-32 h-1 bg-slate-600 rounded-full mx-auto my-2"></div>
    </div>

  </div>

</body>
</html>
