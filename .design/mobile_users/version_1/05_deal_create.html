<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustPassz Mobile - Tạo Giao Dịch Ký Quỹ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-cyan-500 selection:text-black">

  <!-- PHONE DEVICE FRAME WRAPPER (393px x 852px) -->
  <div class="relative w-[393px] h-[852px] bg-[#0B0F17] rounded-[48px] border-[8px] border-slate-800 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.8)] overflow-hidden flex flex-col justify-between">
    
    <!-- TOP STATUS BAR & DYNAMIC ISLAND -->
    <div class="h-11 w-full pt-3 px-7 flex justify-between items-center text-xs text-slate-300 z-50 shrink-0">
      <span class="font-semibold text-sm tracking-tight">9:41</span>
      <div class="w-24 h-6 bg-black rounded-full -mt-1 shadow-inner flex items-center justify-end pr-2.5">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500/20 border border-emerald-500/60 animate-pulse"></div>
      </div>
      <div class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 fill-slate-200" viewBox="0 0 24 24"><path d="M2 17h3v4H2v-4zm5-5h3v9H7v-9zm5-5h3v14h-3V7zm5-5h3v19h-3V2z"/></svg>
        <svg class="w-4 h-4 fill-slate-200" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.22c3.43 0 6.55 1.39 8.84 3.64l-8.84 8.84-8.84-8.84C5.45 8.61 8.57 7.22 12 7.22z"/></svg>
        <div class="w-5 h-2.5 border border-slate-300 rounded-sm p-0.5 flex items-center"><div class="w-3.5 h-1.5 bg-slate-100 rounded-2xs"></div></div>
      </div>
    </div>

    <!-- MAIN SCROLLABLE SCREEN CONTENT -->
    <div class="flex-1 overflow-y-auto no-scrollbar flex flex-col px-4 pt-1 pb-4 gap-3.5">
      
      <!-- Top Navigation Header -->
      <div class="flex items-center justify-between pt-1">
        <button type="button" class="min-h-[44px] min-w-[44px] flex items-center text-xs font-semibold text-cyan-400 gap-1 cursor-pointer">
          <svg class="w-4 h-4 stroke-[2.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
          </svg>
          <span>Quay lại</span>
        </button>
        <h1 class="text-sm font-bold text-white">Tạo Kèo Ký Quỹ</h1>
        <div class="min-w-[44px] flex justify-end">
          <div class="w-7 h-7 rounded-lg bg-cyan-950/80 border border-cyan-500/40 flex items-center justify-center text-cyan-400">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </div>
        </div>
      </div>

      <!-- AI Magic Fill Helper Badge -->
      <div class="p-3 rounded-2xl bg-gradient-to-r from-violet-950/60 to-slate-900 border border-violet-500/30 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-violet-900/50 border border-violet-400/40 flex items-center justify-center text-violet-300 text-sm">
            ✨
          </div>
          <div>
            <span class="text-xs font-bold text-violet-200 block">AI Magic Fill &amp; Audit</span>
            <span class="text-[10px] text-slate-400">Tự động cấu hình điều khoản ký quỹ chuẩn</span>
          </div>
        </div>
        <button type="button" class="h-7 px-2.5 rounded-lg bg-violet-600 hover:bg-violet-500 text-white text-[10px] font-bold cursor-pointer">
          Gợi ý
        </button>
      </div>

      <!-- Form Inputs Group -->
      <div class="space-y-3">
        
        <!-- Field 1: Deal Title -->
        <div>
          <label class="block text-xs font-semibold text-slate-200 mb-1">
            Tiêu đề giao dịch <span class="text-rose-500">*</span>
          </label>
          <input 
            type="text" 
            value="Bàn giao Source Code Nuxt3 + Smart Contract Foundry" 
            class="w-full h-11 bg-[#0F172A] border border-slate-700 rounded-xl px-3 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
          />
        </div>

        <!-- Field 2: Asset Category (2x2 Grid) -->
        <div>
          <label class="block text-xs font-semibold text-slate-200 mb-1.5">
            Loại tài sản số bảo chứng
          </label>
          <div class="grid grid-cols-2 gap-2">
            <!-- Selected Option: Code -->
            <button type="button" class="min-h-[46px] p-2 rounded-xl bg-cyan-950/70 border-1.5 border-cyan-500 flex items-center gap-2 cursor-pointer text-left">
              <span class="text-base">💻</span>
              <div>
                <span class="text-xs font-bold text-cyan-300 block leading-tight">Mã Nguồn</span>
                <span class="text-[9px] text-slate-400">Git / Zip repo</span>
              </div>
            </button>
            <!-- Option 2: License Key -->
            <button type="button" class="min-h-[46px] p-2 rounded-xl bg-[#0F172A] border border-slate-800 flex items-center gap-2 cursor-pointer text-left hover:border-slate-700">
              <span class="text-base">🔑</span>
              <div>
                <span class="text-xs font-bold text-slate-200 block leading-tight">License Key</span>
                <span class="text-[9px] text-slate-400">Khóa bản quyền</span>
              </div>
            </button>
            <!-- Option 3: Design -->
            <button type="button" class="min-h-[46px] p-2 rounded-xl bg-[#0F172A] border border-slate-800 flex items-center gap-2 cursor-pointer text-left hover:border-slate-700">
              <span class="text-base">🎨</span>
              <div>
                <span class="text-xs font-bold text-slate-200 block leading-tight">Thiết Kế</span>
                <span class="text-[9px] text-slate-400">Figma / Raw assets</span>
              </div>
            </button>
            <!-- Option 4: Data -->
            <button type="button" class="min-h-[46px] p-2 rounded-xl bg-[#0F172A] border border-slate-800 flex items-center gap-2 cursor-pointer text-left hover:border-slate-700">
              <span class="text-base">📄</span>
              <div>
                <span class="text-xs font-bold text-slate-200 block leading-tight">Tài Liệu Số</span>
                <span class="text-[9px] text-slate-400">PDF / Database</span>
              </div>
            </button>
          </div>
        </div>

        <!-- Field 3: Deal Amount (VND) -->
        <div>
          <label class="block text-xs font-semibold text-slate-200 mb-1">
            Số tiền ký quỹ (VND) <span class="text-rose-500">*</span>
          </label>
          <div class="relative flex items-center">
            <input 
              type="text" 
              value="15.000.000" 
              class="w-full h-11 bg-[#0F172A] border border-slate-700 rounded-xl pl-3 pr-12 text-sm font-bold text-emerald-400 font-mono focus:outline-none focus:border-cyan-500 tabular-nums"
            />
            <span class="absolute right-3 text-xs font-bold text-slate-400 font-mono">VND</span>
          </div>
          <div class="flex items-center justify-between text-[10px] text-slate-500 mt-1">
            <span>Phí sàn bảo chứng: <strong class="text-slate-300">0 VND</strong> (Miễn phí Beta)</span>
            <span>Tối thiểu: 50.000 VND</span>
          </div>
        </div>

        <!-- Field 4: Inspection Hours Map -->
        <div>
          <label class="block text-xs font-semibold text-slate-200 mb-1.5">
            Thời hạn đồng kiểm két số
          </label>
          <div class="grid grid-cols-4 gap-1.5">
            <button type="button" class="h-9 rounded-xl bg-[#0F172A] border border-slate-800 text-xs font-mono font-medium text-slate-300 hover:border-slate-700 cursor-pointer">
              6h
            </button>
            <button type="button" class="h-9 rounded-xl bg-[#0F172A] border border-slate-800 text-xs font-mono font-medium text-slate-300 hover:border-slate-700 cursor-pointer">
              12h
            </button>
            <!-- Selected 24h -->
            <button type="button" class="h-9 rounded-xl bg-cyan-950/80 border-1.5 border-cyan-500 text-xs font-mono font-bold text-cyan-300 cursor-pointer">
              24h ✓
            </button>
            <button type="button" class="h-9 rounded-xl bg-[#0F172A] border border-slate-800 text-xs font-mono font-medium text-slate-300 hover:border-slate-700 cursor-pointer">
              48h
            </button>
          </div>
        </div>

        <!-- Field 5: Digital Vault Content Box -->
        <div class="p-3.5 rounded-2xl bg-[#0F172A] border border-slate-800 space-y-2">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5">
              <svg class="w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <span class="text-xs font-bold text-slate-200">Két Số AES-256-GCM</span>
            </div>
            <span class="text-[9px] font-mono text-emerald-400 bg-emerald-950/60 border border-emerald-500/30 px-1.5 py-0.5 rounded">
              Mã Hóa Client-Side
            </span>
          </div>

          <textarea 
            rows="3" 
            placeholder="Nhập nội dung bàn giao: Link GitHub repo bí mật, Access Token, License Key..."
            class="w-full bg-[#070A10] border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 font-mono placeholder-slate-600 focus:outline-none focus:border-cyan-500"
          >https://github.com/trustpassz-org/private-core-saas (Token: ghp_99xSecretTokenAlpha2026)</textarea>

          <p class="text-[10px] text-slate-400 leading-tight">
            🔒 Nội dung này được đóng băng trong Két số. Bên mua chỉ xem được sau khi đã nạp tiền ký quỹ qua VietQR.
          </p>
        </div>

      </div>

      <!-- Action Button CTA >= 48px -->
      <div class="pt-1">
        <button type="button" class="w-full h-12 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-slate-950 font-bold text-sm tracking-wide shadow-lg shadow-emerald-950/40 flex items-center justify-center gap-2 cursor-pointer transition-all active:scale-[0.99]">
          <svg class="w-4 h-4 stroke-[2.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
          </svg>
          <span>Khởi Tạo Kèo Ký Quỹ &amp; Nhận VietQR</span>
        </button>
      </div>

    </div>

    <!-- BOTTOM HOME INDICATOR -->
    <div class="w-full shrink-0 z-50">
      <div class="py-2 flex justify-center bg-[#0B0F17]">
        <div class="w-32 h-1 bg-slate-600 rounded-full"></div>
      </div>
    </div>

  </div>

</body>
</html>
