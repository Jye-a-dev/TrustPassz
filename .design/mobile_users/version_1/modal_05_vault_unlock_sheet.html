<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustPassz Mobile - Xác Thực Mở Két Số Digital Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-cyan-500 selection:text-black">

  <!-- PHONE DEVICE FRAME WRAPPER (393px x 852px) -->
  <div class="relative w-[393px] h-[852px] bg-[#0B0F17] rounded-[48px] border-[8px] border-slate-800 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.8)] overflow-hidden flex flex-col justify-between">
    
    <!-- TOP STATUS BAR & DYNAMIC ISLAND -->
    <div class="h-11 w-full pt-3 px-7 flex justify-between items-center text-xs text-slate-300 z-50 shrink-0">
      <span class="font-semibold text-sm tracking-tight">9:41</span>
      <div class="w-24 h-6 bg-black rounded-full -mt-1 shadow-inner flex items-center justify-end pr-2.5">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500/20 border border-emerald-500/60 animate-pulse"></div>
      </div>
      <div class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 fill-slate-200" viewBox="0 0 24 24"><path d="M2 17h3v4H2v-4zm5-5h3v9H7v-9zm5-5h3v14h-3V7zm5-5h3v19h-3V2z"/></svg>
        <svg class="w-4 h-4 fill-slate-200" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.22c3.43 0 6.55 1.39 8.84 3.64l-8.84 8.84-8.84-8.84C5.45 8.61 8.57 7.22 12 7.22z"/></svg>
        <div class="w-5 h-2.5 border border-slate-300 rounded-sm p-0.5 flex items-center"><div class="w-3.5 h-1.5 bg-slate-100 rounded-2xs"></div></div>
      </div>
    </div>

    <!-- MAIN CONTAINER WITH DIMMED PARENT & ACTIVE UNLOCK BOTTOM SHEET -->
    <div class="flex-1 overflow-hidden relative flex flex-col justify-end">
      
      <!-- DIMMED PARENT BACKGROUND SCREEN (DIGITAL VAULT) -->
      <div class="absolute inset-0 px-4 pt-1 pb-4 flex flex-col gap-3 opacity-25 pointer-events-none select-none blur-[1.5px]">
        <div class="h-10 bg-slate-800 rounded-xl"></div>
        <div class="h-14 bg-emerald-950/40 rounded-2xl border border-emerald-500/30"></div>
        <div class="h-32 bg-amber-950/40 rounded-2xl border border-amber-500/40"></div>
        <div class="h-44 bg-[#0F172A] rounded-2xl border border-cyan-500/30"></div>
      </div>

      <!-- ACTIVE BOTTOM SHEET (SLIDE UP) -->
      <div class="relative z-40 rounded-t-[36px] bg-[#0F172A] border-t-2 border-amber-500/80 p-5 shadow-[0_-25px_60px_-15px_rgba(0,0,0,0.9)] flex flex-col items-center text-center space-y-3 animate-in slide-in-from-bottom duration-300">
        
        <!-- Grab Handle -->
        <div class="w-12 h-1.5 bg-slate-700 rounded-full -mt-1"></div>

        <!-- Glowing Amber Safe Lock Icon Badge -->
        <div class="relative flex items-center justify-center">
          <div class="absolute w-16 h-16 rounded-full bg-amber-500/20 blur-xl"></div>
          <div class="relative w-14 h-14 rounded-2xl bg-amber-950/80 border-2 border-amber-400 flex items-center justify-center text-amber-400 shadow-lg shadow-amber-950/60">
            <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
        </div>

        <div>
          <h2 class="text-base font-black text-white tracking-tight">Xác Thực Mở Két Số AES-256</h2>
          <p class="text-[11px] text-slate-400 mt-0.5 max-w-[280px]">
            Dữ liệu giải mã trực tiếp trong phần cứng máy và bắt đầu đồng kiểm <strong>24 Giờ</strong>.
          </p>
        </div>

        <!-- 6-Digit PIN Indicator Dots (4 filled) -->
        <div class="flex items-center gap-3 py-1">
          <div class="w-3.5 h-3.5 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(6,182,212,0.8)]"></div>
          <div class="w-3.5 h-3.5 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(6,182,212,0.8)]"></div>
          <div class="w-3.5 h-3.5 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(6,182,212,0.8)]"></div>
          <div class="w-3.5 h-3.5 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(6,182,212,0.8)]"></div>
          <div class="w-3.5 h-3.5 rounded-full bg-[#0B0F17] border-2 border-slate-700"></div>
          <div class="w-3.5 h-3.5 rounded-full bg-[#0B0F17] border-2 border-slate-700"></div>
        </div>

        <!-- Biometric 1-Tap CTA >= 48px -->
        <button type="button" class="w-full h-11 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold text-xs tracking-wide shadow-md shadow-emerald-950/50 flex items-center justify-center gap-2 cursor-pointer transition-all active:scale-[0.99]">
          <svg class="w-4 h-4 text-slate-950" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3z"/><path d="M3 20c0-3.3 2.7-6 6-6h6c3.3 0 6 2.7 6 6"/><path d="M18 2h3v3M6 2H3v3M21 19v3h-3M3 19v3h3"/></svg>
          <span>Quét FaceID / Vân Tay Mở Tức Thì</span>
        </button>

        <!-- Cyber-Escrow 3x4 Numpad (Keys >= 44px) -->
        <div class="w-full max-w-[280px] grid grid-cols-3 gap-2 pt-1 font-mono">
          <button type="button" class="h-10 rounded-xl bg-[#0B0F17] border border-slate-800 hover:border-slate-700 text-sm font-bold text-slate-200 cursor-pointer">1</button>
          <button type="button" class="h-10 rounded-xl bg-[#0B0F17] border border-slate-800 hover:border-slate-700 text-sm font-bold text-slate-200 cursor-pointer">2</button>
          <button type="button" class="h-10 rounded-xl bg-[#0B0F17] border border-slate-800 hover:border-slate-700 text-sm font-bold text-slate-200 cursor-pointer">3</button>
          
          <button type="button" class="h-10 rounded-xl bg-[#0B0F17] border border-slate-800 hover:border-slate-700 text-sm font-bold text-slate-200 cursor-pointer">4</button>
          <button type="button" class="h-10 rounded-xl bg-[#0B0F17] border border-slate-800 hover:border-slate-700 text-sm font-bold text-slate-200 cursor-pointer">5</button>
          <button type="button" class="h-10 rounded-xl bg-[#0B0F17] border border-slate-800 hover:border-slate-700 text-sm font-bold text-slate-200 cursor-pointer">6</button>

          <button type="button" class="h-10 rounded-xl bg-[#0B0F17] border border-slate-800 hover:border-slate-700 text-sm font-bold text-slate-200 cursor-pointer">7</button>
          <button type="button" class="h-10 rounded-xl bg-[#0B0F17] border border-slate-800 hover:border-slate-700 text-sm font-bold text-slate-200 cursor-pointer">8</button>
          <button type="button" class="h-10 rounded-xl bg-[#0B0F17] border border-slate-800 hover:border-slate-700 text-sm font-bold text-slate-200 cursor-pointer">9</button>

          <button type="button" class="h-10 rounded-xl bg-[#0B0F17] border border-slate-800 text-cyan-400 flex items-center justify-center cursor-pointer">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3z"/><path d="M3 20c0-3.3 2.7-6 6-6h6c3.3 0 6 2.7 6 6"/></svg>
          </button>
          <button type="button" class="h-10 rounded-xl bg-[#0B0F17] border border-slate-800 hover:border-slate-700 text-sm font-bold text-slate-200 cursor-pointer">0</button>
          <button type="button" class="h-10 rounded-xl bg-[#0B0F17] border border-slate-800 text-slate-400 hover:text-rose-400 flex items-center justify-center cursor-pointer">⌫</button>
        </div>

      </div>

    </div>

    <!-- BOTTOM HOME INDICATOR -->
    <div class="w-full shrink-0 z-50">
      <div class="py-2 flex justify-center bg-[#0B0F17]">
        <div class="w-32 h-1 bg-slate-600 rounded-full"></div>
      </div>
    </div>

  </div>

</body>
</html>
