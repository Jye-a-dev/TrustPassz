<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustPassz Mobile - Thông Báo Google Sign-In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-cyan-500 selection:text-black">

  <!-- DEVICE SHELL FRAME (iPhone 393px x 852px) -->
  <div class="w-[393px] h-[852px] bg-[#080C14] text-slate-100 rounded-[52px] border-[10px] border-slate-800/90 shadow-2xl relative overflow-hidden flex flex-col font-sans select-none">
    
    <!-- TOP STATUS BAR & DYNAMIC ISLAND -->
    <div class="h-11 w-full pt-2 px-7 flex justify-between items-center text-xs text-slate-300 z-50 shrink-0">
      <span class="font-semibold text-sm tracking-tight">9:41</span>
      <div class="w-28 h-7 bg-black rounded-full mx-auto -mt-1 flex items-center justify-between px-3 shadow-inner">
        <div class="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-800"></div>
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500/30 border border-emerald-500/80 animate-pulse"></div>
      </div>
      <div class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 fill-slate-200" viewBox="0 0 24 24"><path d="M2 17h3v4H2v-4zm5-5h3v9H7v-9zm5-5h3v14h-3V7zm5-5h3v19h-3V2z"/></svg>
        <svg class="w-4 h-4 fill-slate-200" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.22c3.43 0 6.55 1.39 8.84 3.64l-8.84 8.84-8.84-8.84C5.45 8.61 8.57 7.22 12 7.22z"/></svg>
        <div class="w-5 h-2.5 border border-slate-300 rounded-sm p-0.5 flex items-center"><div class="w-3.5 h-1.5 bg-slate-100 rounded-2xs"></div></div>
      </div>
    </div>

    <!-- MAIN CONTAINER WITH DIMMED PARENT UNDERNEATH & ACTIVE MODAL OVERLAY -->
    <div class="flex-1 overflow-hidden relative flex flex-col">

      <!-- DIMMED PARENT BACKGROUND SCREEN (LOGIN SCREEN) -->
      <div class="absolute inset-0 px-6 py-4 flex flex-col justify-between opacity-30 pointer-events-none select-none blur-[2px]">
        <div class="flex flex-col items-center mt-2">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-r from-cyan-400 to-emerald-400 flex items-center justify-center text-slate-950 font-black text-lg">TP</div>
          <div class="h-5 w-44 bg-slate-700 rounded mt-3"></div>
          <div class="h-3 w-56 bg-slate-800 rounded mt-1"></div>
        </div>
        <div class="space-y-3 my-auto">
          <div class="h-12 rounded-xl bg-[#0F172A] border border-slate-800"></div>
          <div class="h-12 rounded-xl bg-[#0F172A] border border-slate-800"></div>
          <div class="h-28 rounded-2xl bg-[#0F172A] border border-slate-800"></div>
        </div>
        <div class="h-8 bg-slate-800/40 rounded-full"></div>
      </div>

      <!-- ACTIVE BACKDROP BLUR OVERLAY -->
      <div class="absolute inset-0 bg-black/70 backdrop-blur-sm z-30"></div>

      <!-- ACTIVE ALERT DIALOG -->
      <div class="z-40 w-[335px] mx-auto my-auto p-5 rounded-2xl bg-[#0F172A] border border-slate-800 shadow-2xl flex flex-col items-center text-center animate-in fade-in zoom-in-95 duration-200">
        
        <!-- Google Multi-Color / Warning Amber Icon Badge -->
        <div class="size-12 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-400 flex items-center justify-center mb-3.5 shadow-lg shadow-amber-950/40">
          <svg class="w-6 h-6" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.54 0 2.94.55 4.04 1.45l3.03-3.03C17.24 1.7 14.78 1 12 1 7.46 1 3.59 3.58 1.63 7.37l3.71 2.88C6.23 7.42 8.87 5 12 5z"/>
            <path fill="#4285F4" d="M23.49 12.28c0-.79-.07-1.54-.19-2.28H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58l3.71 2.88c2.16-1.99 3.71-4.93 3.71-8.69z"/>
            <path fill="#FBBC05" d="M5.34 14.75c-.24-.72-.38-1.49-.38-2.28 0-.79.14-1.56.38-2.28L1.63 7.37C.59 9.47 0 11.67 0 14s.59 4.53 1.63 6.63l3.71-2.88z"/>
            <path fill="#34A853" d="M12 23c3.24 0 5.95-1.08 7.93-2.91l-3.71-2.88c-1.08.72-2.45 1.16-4.22 1.16-3.13 0-5.77-2.12-6.66-4.99L1.63 16.26C3.59 20.42 7.46 23 12 23z"/>
          </svg>
        </div>

        <h3 class="text-base font-bold text-white tracking-tight">Thông Báo Google Sign-In</h3>
        
        <p class="text-xs text-slate-400 mt-2 leading-relaxed text-center px-1">
          Google Sign-in SDK chưa được cấu hình Web Client ID trên môi trường máy ảo hoặc trình duyệt này. Vui lòng sử dụng nút <span class="text-amber-400 font-medium">"Đăng Nhập Test Session (DEV)"</span> bên dưới để trải nghiệm ngay.
        </p>

        <div class="w-full mt-5">
          <button type="button" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm min-h-[44px] cursor-pointer transition-colors border border-slate-700/60 active:scale-[0.99]">
            Đã hiểu
          </button>
        </div>

      </div>

    </div>

    <!-- BOTTOM HOME INDICATOR -->
    <div class="w-full shrink-0 z-50">
      <div class="w-32 h-1 bg-slate-600 rounded-full mx-auto my-2"></div>
    </div>

  </div>

</body>
</html>
