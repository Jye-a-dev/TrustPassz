<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440, initial-scale=1.0">
  <title>Chỉnh Sửa Kèo Giao Dịch (Modal Dialog) - TrustPassz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            slate: {
              950: '#0B0F17',
              900: '#0F172A',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #080C14; color: #F1F5F9; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#080C14] text-slate-100 min-h-screen relative overflow-hidden">
  <div class="w-[1440px] mx-auto min-h-screen relative flex items-center justify-center">

    <!-- Blurred Background Mockup of Deal Room -->
    <div class="absolute inset-0 p-8 filter blur-sm opacity-30 pointer-events-none select-none">
      <div class="max-w-5xl mx-auto space-y-6">
        <div class="h-16 bg-slate-900/60 rounded-2xl border border-zinc-800"></div>
        <div class="grid grid-cols-3 gap-6">
          <div class="col-span-2 h-96 bg-slate-900/60 rounded-2xl border border-zinc-800"></div>
          <div class="h-96 bg-slate-900/60 rounded-2xl border border-zinc-800"></div>
        </div>
      </div>
    </div>

    <!-- Backdrop Dimmer Overlay -->
    <div class="absolute inset-0 bg-black/75 backdrop-blur-sm z-10"></div>

    <!-- Modal Dialog Container (Centered) -->
    <div class="relative z-20 w-full max-w-lg p-6 rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl shadow-cyan-950/40 animate-in fade-in zoom-in-95">

      <!-- Dialog Header -->
      <div class="flex items-center justify-between pb-4 border-b border-zinc-800">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
          </div>
          <div>
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
              Chỉnh Sửa Thông Tin Kèo
            </h2>
            <p class="text-xs text-slate-400">Cập nhật các điều khoản trước khi bên mua thực hiện cọc tiền</p>
          </div>
        </div>
        <button type="button" class="w-8 h-8 rounded-lg bg-slate-800/60 hover:bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition-colors cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Dialog Form -->
      <form class="space-y-4 pt-4">
        <!-- Title Field -->
        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-slate-300">Tiêu đề giao dịch</label>
          <input
            type="text"
            value="Bàn giao Mã nguồn SaaS AI WebApp + Quyền sở hữu tên miền (Domain Transfer)"
            class="w-full h-11 rounded-xl bg-slate-950 border border-slate-800 px-3.5 text-slate-100 text-sm focus:outline-none focus:border-cyan-500"
          />
        </div>

        <!-- Amount and Inspection Duration Grid -->
        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-1.5">
            <label class="text-xs font-semibold text-slate-300">Giá bán (VNĐ)</label>
            <input
              type="text"
              value="45.000.000"
              class="w-full h-11 rounded-xl bg-slate-950 border border-slate-800 px-3.5 text-slate-100 text-sm font-mono font-bold text-emerald-400 focus:outline-none focus:border-emerald-500"
            />
          </div>

          <div class="space-y-1.5">
            <label class="text-xs font-semibold text-slate-300">Thời gian kiểm tra</label>
            <div class="relative">
              <select class="w-full h-11 rounded-xl bg-slate-950 border border-slate-800 px-3.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500 appearance-none">
                <option value="21600">6 Giờ (Nhanh)</option>
                <option value="43200">12 Giờ (Tiêu chuẩn)</option>
                <option value="86400" selected>24 Giờ (Khuyên dùng)</option>
                <option value="172800">48 Giờ (Hàng vật lý)</option>
              </select>
              <div class="absolute right-3.5 top-3.5 pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Description Field -->
        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-slate-300">Mô tả phạm vi bàn giao</label>
          <textarea
            rows="3"
            class="w-full rounded-xl border border-slate-800 bg-slate-950 px-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500 resize-none"
          >Toàn bộ source code Fullstack Next.js 15, Prisma ORM, Docker Compose setup, kèm thủ tục ủy quyền chuyển nhượng tên miền DNS Cloudflare.</textarea>
        </div>

        <!-- Warning Note -->
        <div class="p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-start gap-2.5 text-xs text-amber-300">
          <svg class="w-4 h-4 text-amber-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>Sau khi bên mua quét VietQR chuyển cọc, mọi điều khoản về giá và thời gian đồng kiểm sẽ bị khóa bất biến trên Smart Contract.</span>
        </div>

        <!-- Footer Actions -->
        <div class="flex items-center justify-end gap-3 pt-3 border-t border-zinc-800">
          <button
            type="button"
            class="h-10 px-4 rounded-xl border border-slate-700 hover:bg-slate-800 text-slate-300 text-xs font-semibold transition-colors cursor-pointer"
          >
            Hủy bỏ
          </button>
          <button
            type="button"
            class="h-10 px-5 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-slate-950 font-bold text-xs shadow-lg shadow-cyan-950/50 transition-all cursor-pointer"
          >
            Lưu Thay Đổi
          </button>
        </div>
      </form>

    </div>

  </div>
</body>
</html>
